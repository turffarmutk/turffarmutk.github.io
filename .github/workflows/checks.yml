# Runs the app's checks on GitHub every time anything is pushed.
#
# The pre-push hook in .githooks/ is the first line of defence, but it only
# works on a machine where somebody ran `git config core.hooksPath .githooks`,
# and it can be skipped with --no-verify. This cannot be skipped and needs
# nothing installed anywhere.
#
# A failure shows as a red X next to the commit on github.com, and GitHub
# emails the person who pushed. That turns a silent breakage -- the kind that
# was live for two days in August 2026 -- into something that finds you.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:      # lets you run it by hand from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must stay at or above what jsdom needs -- jsdom 30 wants Node 22.22,
          # 24.15 or newer, and the test harnesses are built on it. Pinned to 20
          # here, every check failed within seconds of starting while the same
          # checks passed on the farm laptop, because the laptop runs 24. The
          # steps that do not touch jsdom passed, which made it look like the
          # tests themselves were broken. If you change this, check
          # package.json's "engines" first.
          node-version: '24'

      - name: Install the dev tools
        run: npm install --no-audit --no-fund

      - name: Does the offline file match the app?
        # sw.js is generated. If rebuilding it changes it, it was not rebuilt
        # after the last edit -- and every phone that already has the app would
        # keep showing the old version, silently. Fail loudly instead.
        run: |
          before=$(shasum sw.js | cut -d' ' -f1)
          npm run sw --silent
          after=$(shasum sw.js | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo "::error::sw.js is out of date. Run 'npm run sw' and commit the result."
            exit 1
          fi
          echo "sw.js is current."

      - name: Run every check
        run: npm test
